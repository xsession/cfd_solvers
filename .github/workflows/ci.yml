name: ci

on:
  push:
  pull_request:

jobs:
  cpu:
    strategy:
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCFD_ENABLE_OPENMP=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan + UBSan
        run: >-
          cmake -S . -B build-sanitize
          -DCMAKE_BUILD_TYPE=Debug
          -DCFD_ENABLE_OPENMP=OFF
          -DCFD_ENABLE_SYCL=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build sanitizer smoke target
        run: cmake --build build-sanitize --target cfd-sanitize-smoke cfd-extension-tests --parallel 2
      - name: Run sanitizer smoke
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          ./build-sanitize/cfd-sanitize-smoke
          ./build-sanitize/cfd-extension-tests

  mpi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenMPI
        run: sudo apt-get update && sudo apt-get install -y openmpi-bin libopenmpi-dev
      - name: Configure MPI + OpenMP
        run: >-
          cmake -S . -B build-mpi
          -DCMAKE_BUILD_TYPE=Release
          -DCFD_ENABLE_OPENMP=ON
          -DCFD_ENABLE_MPI=ON
          -DCFD_ENABLE_SYCL=OFF
      - name: Build
        run: cmake --build build-mpi --parallel 2
      - name: Test MPI and CPU regressions
        env:
          OMPI_MCA_rmaps_base_oversubscribe: "1"
        run: ctest --test-dir build-mpi --output-on-failure
